name: Publish Family Cinema Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['plugin-web/**', 'scripts/build-pages.py', '.github/workflows/deploy-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: family-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Load pinned Lampa web client
        uses: actions/checkout@v7
        with:
          repository: yumata/lampa
          ref: 86f3afa5997793242cc2a081da96efb0934ae71f
          path: .build/lampa-web
          persist-credentials: false
      - name: Prepare Pages with family plugin and GPL sources
        run: python3 scripts/build-pages.py .build/lampa-web .pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
