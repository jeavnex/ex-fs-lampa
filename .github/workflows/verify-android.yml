name: Android verification
run-name: Android verification (${{ inputs.suite }})
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'all = UI and live playback; ui = touch, remote, Back and clipboard'
        type: choice
        options: [all, ui]
        default: all
permissions:
  contents: read
jobs:
  source_transport:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare public provider availability from the test network
        run: |
          node --input-type=module <<'JS'
          const url='https://api.nextembed.ws/embed/kp/1009784';
          for(const agent of ['FamilyCinema-SourceCheck/2.0','Mozilla/5.0 (Linux; Android 15; sdk_gphone64_x86_64 Build/AE3A.240806.043; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/124.0.6367.219 Mobile Safari/537.36']){
            const response=await fetch(url,{headers:{Referer:'http://ex-fs.net/','User-Agent':agent},signal:AbortSignal.timeout(20000)});
            const body=await response.text();
            console.log(JSON.stringify({client:agent.startsWith('Family')?'service':'android-webview',status:response.status,title:body.match(/<title>([^<]*)/i)?.[1],message:response.ok?'HTML received':body.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,250)}));
          }
          JS
  android:
    name: Android ${{ inputs.suite }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lampa-app/LAMPA
          ref: 28d7616f52d969abd6a93d8692b15a8525b36efc
          path: .build/lampa-upstream
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare application and Android tests
        env:
          FAMILY_APP_KEY: ${{ secrets.FAMILY_APP_KEY }}
        run: python3 android-tv-mobile-app/prepare.py "$GITHUB_WORKSPACE/.build/lampa-upstream"
      - name: Enable KVM for the temporary test runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FAMILY_TEST_SUITE: ${{ inputs.suite }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-verification
          path: |
            android-evidence/
            android-tv-mobile-app/generated/app/build/reports/androidTests/
          retention-days: 1
