name: Daily EX-FS source check
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify source, search and cached players
        env:
          FAMILY_MAINTENANCE_KEY: ${{ secrets.FAMILY_MAINTENANCE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const response=await fetch('https://family-cinema-api.pvde.workers.dev/api/maintenance',{method:'POST',headers:{'X-Family-Maintenance-Key':process.env.FAMILY_MAINTENANCE_KEY},signal:AbortSignal.timeout(90000)});
          const report=await response.json(); console.log(report);
          if(!response.ok||!report.ok)process.exit(1);
          JS
