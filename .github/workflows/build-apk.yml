name: Build FamilyCinema.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-tv-mobile-app/**', 'scripts/publish-apk.py', '.github/workflows/build-apk.yml']
permissions:
  contents: write
concurrency:
  group: family-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Load pinned Android build base
        uses: actions/checkout@v7
        with:
          repository: lampa-app/LAMPA
          ref: 28d7616f52d969abd6a93d8692b15a8525b36efc
          path: .build/lampa-upstream
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare local Family interface
        env:
          FAMILY_APP_KEY: ${{ secrets.FAMILY_APP_KEY }}
        run: python3 android-tv-mobile-app/prepare.py "$GITHUB_WORKSPACE/.build/lampa-upstream"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build with the permanent signing key
        working-directory: android-tv-mobile-app/generated
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILY_KEYSTORE_PASSWORD }}
          RELEASE_SIGN_KEY_ALIAS: ${{ secrets.FAMILY_KEY_ALIAS }}
          RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.FAMILY_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$RELEASE_SIGN_KEY_ALIAS" && test -n "$RELEASE_SIGN_KEY_PASSWORD"
          export KEYSTORE_FILE="$RUNNER_TEMP/family-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          python3 -c 'import os,base64,pathlib; p=pathlib.Path(os.environ["KEYSTORE_FILE"]); p.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"])); p.chmod(0o600)'
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-output/FamilyCinema.apk"
          cp version.json "$GITHUB_WORKSPACE/apk-output/version.json"
      - name: Prepare checksum and publish the single latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-apk.py metadata apk-output
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title 'Домашнее кино — актуальная сборка' --notes 'Постоянный файл FamilyCinema.apk. Устанавливается поверх прежней версии с тем же ключом подписи.'
          gh release upload latest apk-output/FamilyCinema.apk apk-output/version.json apk-output/SHA256SUMS.txt --clobber
          gh release edit latest --target "$GITHUB_SHA" --latest
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
      - name: Publish APK to Family Cinema D1 storage
        env:
          FAMILY_RELEASE_KEY: ${{ secrets.FAMILY_RELEASE_KEY }}
        run: python3 scripts/publish-apk.py upload apk-output
      - uses: actions/upload-artifact@v7
        with:
          name: FamilyCinema
          path: apk-output/*
          retention-days: 1
          if-no-files-found: error
