plugins { id 'com.android.application'; id 'kotlin-android' }
android {
    namespace 'top.rootu.lampa'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.jeavnex.familycinema'
        minSdk 21
        targetSdk 28
        versionCode @VERSION_CODE@
        versionName '@VERSION_NAME@'
        buildConfigField 'String', 'FAMILY_APP_KEY', @APP_KEY@
        buildConfigField 'String', 'BUILD_DATE', @BUILD_DATE@
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE') != null) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_SIGN_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_SIGN_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
